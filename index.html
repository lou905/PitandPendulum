<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Escape the Pit</title>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0807;--panel:#1b1412;--line:#4a3528;--ink:#ecdfc6;--dim:#a8977a;--blood:#c23a2b;--ember:#ff7a33;--gold:#d9b45c;--ok:#7fbf6a}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:radial-gradient(ellipse at top,#1c1210 0%,var(--bg) 60%);color:var(--ink);font-family:'IM Fell English',Georgia,'Times New Roman',serif}
#app{max-width:1100px;margin:0 auto;padding:10px 16px 24px}
header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:4px 0 10px;border-bottom:1px solid var(--line)}
h1{font-family:'IM Fell English SC',Georgia,serif;font-weight:normal;font-size:26px;margin:0;letter-spacing:1px;color:var(--gold);flex:1;min-width:200px}
.chip{font-size:15px;padding:5px 11px;border:1px solid var(--line);border-radius:20px;background:#140e0c;color:var(--dim);white-space:nowrap}
.chip b{color:var(--ink);font-weight:normal}
.hbtn{font:inherit;font-size:15px;padding:5px 12px;border-radius:20px;border:1px solid var(--line);background:#24191500;color:var(--ink);cursor:pointer}
.hbtn:hover{border-color:var(--gold);color:var(--gold)}
#stage{position:relative;width:100%;aspect-ratio:1000/620;background:#000;border:1px solid var(--line);margin-top:10px;border-radius:6px;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.6)}
canvas{width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
#narr{margin-top:10px;min-height:52px;padding:10px 14px;background:var(--panel);border:1px solid var(--line);border-radius:6px;font-size:18px;line-height:1.4}
#narr b{color:var(--gold);font-weight:normal}
#ctrl{margin-top:10px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;min-height:10px}
.slot{width:64px;height:72px;border:1px solid var(--line);border-radius:6px;background:#140e0c;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--dim);font-size:13px}
.slot span{font-family:'IM Fell English SC',Georgia,serif;font-size:32px;color:#3a2c24;line-height:1}
.slot.got{border-color:var(--gold);box-shadow:0 0 14px rgba(217,180,92,.35)}
.slot.got span{color:var(--gold)}
.tr{font:inherit;font-size:20px;width:86px;height:70px;border-radius:8px;border:2px solid var(--line);background:#1a1210;color:var(--dim);cursor:pointer;transition:transform .08s}
.tr.lit{color:var(--ink);border-color:#8a6a3a}
.tr.flash{background:#e8b84f;color:#1a1210;transform:scale(1.08);box-shadow:0 0 24px #e8b84f}
.tr:disabled{cursor:default}
#modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.74);padding:16px;z-index:10;overflow:auto}
#modal.show{display:flex}
.card{background:linear-gradient(#211815,#171110);border:1px solid #6a4a34;max-width:640px;width:100%;padding:24px 26px;border-radius:8px;box-shadow:0 20px 60px rgba(0,0,0,.8);margin:auto}
.card h2{font-family:'IM Fell English SC',Georgia,serif;font-weight:normal;font-size:28px;margin:4px 0 12px;color:var(--gold);line-height:1.15}
.card h3{font-weight:normal;font-size:22px;margin:6px 0 14px;line-height:1.3}
.card p{font-size:18px;line-height:1.5;margin:8px 0}
.kicker{font-size:13px;letter-spacing:3px;text-transform:uppercase;color:var(--blood)}
.pre{font-style:italic;color:#d6c6a8;border-left:3px solid var(--line);padding-left:12px}
.quote{font-style:italic;color:#e9d9b6;font-size:20px!important;border-left:3px solid var(--blood);padding-left:14px}
button.opt{display:block;width:100%;text-align:left;font:inherit;font-size:18px;padding:11px 14px;margin:8px 0;border-radius:6px;border:1px solid var(--line);background:#120d0b;color:var(--ink);cursor:pointer}
button.opt:hover:not(:disabled){border-color:var(--gold)}
button.opt.right{border-color:var(--ok);background:#18240f}
button.opt.wrong{border-color:var(--blood);background:#2a0f0c}
.btn{font:inherit;font-size:19px;padding:10px 22px;border-radius:6px;border:1px solid var(--gold);background:#3a2814;color:var(--ink);cursor:pointer;margin-top:10px}
.btn:hover{background:#4d3519}
.okt{color:var(--ok)}.badt{color:#ff8a7a}
.why{color:var(--dim)}
input.txt{font:inherit;font-size:22px;padding:10px 12px;width:100%;border-radius:6px;border:1px solid var(--line);background:#0e0a09;color:var(--ink);letter-spacing:2px}
.cert{text-align:center}
.cert .big{font-family:'IM Fell English SC',Georgia,serif;font-size:42px;color:var(--gold);margin:6px 0}
.stats{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:14px 0}
.stats div{border:1px solid var(--line);border-radius:6px;padding:8px 14px;min-width:110px}
.stats small{display:block;color:var(--dim);font-size:13px;letter-spacing:2px;text-transform:uppercase}
.stats b{font-weight:normal;font-size:24px}
.code{font-family:'IM Fell English SC',Georgia,serif;font-size:28px;letter-spacing:4px;color:var(--ember);border:1px dashed var(--ember);display:inline-block;padding:6px 16px;border-radius:6px}
.tl{list-style:none;padding:0;margin:10px 0}
.tl li{display:flex;align-items:center;gap:8px;padding:8px 10px;margin:6px 0;border:1px solid var(--line);border-radius:6px;background:#120d0b;font-size:16px;line-height:1.3}
.tl li.ok{border-color:var(--ok);background:#141f0e}
.tl li .n{color:var(--gold);min-width:22px}
.tl li .t{flex:1}
.tl li button{font:inherit;font-size:14px;width:36px;height:32px;border-radius:5px;border:1px solid var(--line);background:#1c1411;color:var(--ink);cursor:pointer}
.tl li button:disabled{opacity:.25;cursor:default}
.lvls{display:flex;gap:6px;justify-content:center;margin:10px 0 4px;flex-wrap:wrap}
.lvls span{font-size:13px;padding:3px 9px;border:1px solid var(--line);border-radius:12px;color:var(--dim)}
.lvls span.on{border-color:var(--gold);color:var(--gold)}
.lvls span.done{border-color:var(--ok);color:var(--ok)}
.mini{width:100%;border-collapse:collapse;margin:8px 0;font-size:15px}.mini td{padding:4px 8px;border-bottom:1px solid var(--line);text-align:left}.mini td:last-child{text-align:right}
@media (max-width:600px){h1{font-size:21px}#narr{font-size:16px}.card{padding:18px}.card p,button.opt{font-size:16px}.tr{width:66px;height:60px;font-size:17px}}
@media print{header,#stage,#narr,#ctrl{display:none}#modal{position:static;background:none}.card{box-shadow:none;border:2px solid #000;background:#fff;color:#000}.card *{color:#000!important}.btn{display:none}}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Escape the Pit</h1>
    <span class="chip" id="where">Toledo, Spain</span>
    <span class="chip">Level <b id="lvl">–</b></span>
    <span class="chip">Time <b id="clock">0:00</b></span>
    <span class="chip">Mistakes <b id="mist">0</b></span>
    <button class="hbtn" id="hintBtn">Hint</button>
    <button class="hbtn" id="muteBtn">Sound: On</button>
    <button class="hbtn" id="restartBtn">Restart</button>
  </header>
  <div id="stage"><canvas id="cv"></canvas></div>
  <div id="narr">An escape room based on Edgar Allan Poe's “The Pit and the Pendulum.”</div>
  <div id="ctrl"></div>
</div>
<div id="modal"></div>

<script>
/* ============ Setup ============ */
const W=1000,H=620;
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const $=s=>document.querySelector(s);
const M=$('#modal'),NARR=$('#narr'),CTRL=$('#ctrl');
function resize(){const r=cv.getBoundingClientRect(),d=window.devicePixelRatio||1;cv.width=Math.round(r.width*d);cv.height=Math.round(r.height*d);ctx.setTransform(cv.width/W,0,0,cv.height/H,0,0);}
window.addEventListener('resize',resize);resize();
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function say(t){NARR.innerHTML=t;}
const modalOpen=()=>M.classList.contains('show');
function showModal(html){M.innerHTML='<div class="card">'+html+'</div>';M.classList.add('show');M.scrollTop=0;}
function hideModal(){M.classList.remove('show');}
const G={team:'',start:0,end:0,mistakes:0,hints:0,shake:0,hintIx:{},lvl:0,lm:[0,0,0,0,0,0,0,0,0],resumed:0};
function miss(n=1){G.mistakes+=n;G.lm[G.lvl]=(G.lm[G.lvl]||0)+n;$('#mist').textContent=G.mistakes;}
const LV=[null,
  {s:'ch0',name:'The Tribunal',code:''},
  {s:'ch1',name:'Darkness & the Pit',code:'SERGE'},
  {s:'drug',name:'The Drugged Water',code:'PITCHER'},
  {s:'paint',name:'The Painted Walls',code:'LOZENGE'},
  {s:'ch2',name:'The Pendulum',code:'SCYTHE'},
  {s:'ch3',name:'The Burning Walls',code:'SURCINGLE'},
  {s:'testi',name:'Testimony to Lasalle',code:'TALON'}];
function NM(){return (G.team||'Prisoner').replace(/[<>&"]/g,'');}
function lvlDots(n){return '<div class="lvls">'+LV.slice(1).map((l,i)=>`<span class="${i+1<n?'done':i+1===n?'on':''}">${i+1}. ${l.name}</span>`).join('')+'</div>';}
function levelCard(n,goal,cb){G.lvl=n;$('#lvl').textContent=n+' / '+(LV.length-1);
  showModal(`<div class="kicker">Level ${n} of ${LV.length-1}</div><h2>${LV[n].name}</h2>${lvlDots(n)}<p>${goal}</p>${LV[n].code?`<p class="why">Resume code for this level: <b style="color:var(--ember);font-weight:normal;letter-spacing:2px">${LV[n].code}</b> — write it down in case you have to stop.</p>`:''}<button class="btn" id="lvGo">Begin Level ${n}</button>`);
  $('#lvGo').onclick=()=>{hideModal();cb&&cb();};}

/* ============ Audio (Web Audio, no files) ============ */
/* Everything is synthesized live: a stone-dungeon reverb, a soundscape per level,
   and effects. No audio files, so nothing can be blocked on the school network. */
const A={c:null,muted:false,master:null,rev:null,nb:null,amb:null,ambName:'',danger:0,hb:0,drip:2,crk:0,chain:6};
function makeIR(c,dur,decay){const len=Math.floor(c.sampleRate*dur),b=c.createBuffer(2,len,c.sampleRate);for(let ch=0;ch<2;ch++){const d=b.getChannelData(ch);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,decay);}return b;}
function ac(){
  if(!A.c){const c=new (window.AudioContext||window.webkitAudioContext)();A.c=c;
    const comp=c.createDynamicsCompressor();comp.threshold.value=-16;comp.knee.value=12;comp.ratio.value=4;comp.connect(c.destination);
    A.master=c.createGain();A.master.gain.value=A.muted?0:1;A.master.connect(comp);
    A.rev=c.createConvolver();A.rev.buffer=makeIR(c,3.4,2.8);const rg=c.createGain();rg.gain.value=.55;A.rev.connect(rg).connect(A.master);
    const len=c.sampleRate*2;A.nb=c.createBuffer(1,len,c.sampleRate);const d=A.nb.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;}
  if(A.c.state==='suspended')A.c.resume();return A.c;}
function out(node,wet=.4){node.connect(A.master);if(wet>0){const s=A.c.createGain();s.gain.value=wet;node.connect(s);s.connect(A.rev);}}
function env(g,t,vol,att,dur){g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(vol,t+att);g.gain.exponentialRampToValueAtTime(.0001,t+Math.max(att+.01,dur));}
function tone(f,dur,type='sine',vol=.2,when=0,att=.01,wet=.35,f2){if(A.muted||!A.c)return;const c=A.c,t=c.currentTime+when,o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);env(g,t,vol,att,dur);o.connect(g);out(g,wet);o.start(t);o.stop(t+dur+.05);}
function noise(dur,vol=.2,freq=800,q=1,when=0,type='bandpass',wet=.35,f2){if(A.muted||!A.c)return;const c=A.c,t=c.currentTime+when,s=c.createBufferSource();s.buffer=A.nb;s.loop=true;const f=c.createBiquadFilter();f.type=type;f.frequency.setValueAtTime(freq,t);if(f2)f.frequency.exponentialRampToValueAtTime(f2,t+dur);f.Q.value=q;const g=c.createGain();env(g,t,vol,.005,dur);s.connect(f).connect(g);out(g,wet);s.start(t,Math.random()*1.5);s.stop(t+dur+.05);}
function brass(f,dur,vol=.12,when=0){if(A.muted||!A.c)return;const c=A.c,t=c.currentTime+when,g=c.createGain();
  g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(vol,t+.05);g.gain.setValueAtTime(vol,t+Math.max(.06,dur-.1));g.gain.exponentialRampToValueAtTime(.0001,t+dur+.12);
  const lp=c.createBiquadFilter();lp.type='lowpass';lp.Q.value=2;lp.frequency.setValueAtTime(f*1.2,t);lp.frequency.linearRampToValueAtTime(f*7,t+.07);lp.frequency.linearRampToValueAtTime(f*3.5,t+.25);
  const vib=c.createOscillator(),vg=c.createGain();vib.frequency.value=5.5;vg.gain.setValueAtTime(0,t);vg.gain.linearRampToValueAtTime(f*.006,t+.3);vib.connect(vg);
  [-6,0,7].forEach(cn=>{const o=c.createOscillator();o.type='sawtooth';o.frequency.value=f;o.detune.value=cn;vg.connect(o.frequency);o.connect(lp);o.start(t);o.stop(t+dur+.25);});
  vib.start(t);vib.stop(t+dur+.25);lp.connect(g);out(g,.5);}
function bell(f,vol=.1,when=0){[[1,1,2.2],[2.76,.5,1.4],[5.4,.25,.8],[8.9,.12,.5]].forEach(([r,a,d])=>tone(f*r,d,'sine',vol*a,when,.002,.6));}
const SFX={
  good(){bell(784,.11);bell(1175,.08,.12);},
  bad(){tone(98,.7,'sawtooth',.08,0,.01,.4);tone(104,.7,'sawtooth',.08,0,.01,.4);noise(.5,.14,220,1,0,'lowpass',.3);},
  whoosh(v=.16){noise(.6,v*1.3,350,1.5,0,'bandpass',.3,1800);if(v>.13)tone(2300+Math.random()*300,.6,'sine',v*.12,.18,.002,.9);},
  fall(){noise(.15,.25,1800,3,0,'bandpass',.5);for(let i=1;i<7;i++)noise(.06,.2/i,1200+Math.random()*1800,4,i*.22+Math.random()*.08,'bandpass',.6);noise(1,.25,700,.6,2.1,'lowpass',.8,200);tone(140,.4,'sine',.08,2.1,.01,.7,60);},
  squeak(){const b=Math.random()*400;tone(2600+b,.07,'sine',.05,0,.005,.3,3400+b);tone(3000+b,.05,'sine',.04,.11,.005,.3,3700+b);},
  chew(){for(let i=0;i<14;i++)noise(.03,.1+Math.random()*.08,2500+Math.random()*2500,3,i*.1+Math.random()*.04,'bandpass',.15);},
  trumpet(i,dur=.5){brass([261.6,329.6,392,523.3][i],dur);},
  fanfare(){const n=[[392,.16],[392,.16],[392,.16],[523.3,.55],[392,.22],[523.3,.9]];let w=0;n.forEach(([f,d])=>{brass(f,d,.12,w);brass(f/2,d,.06,w);w+=d+.05;});[261.6,329.6,392,523.3].forEach(f=>brass(f,1.8,.06,w));},
  rumble(){noise(1.8,.32,90,.7,0,'lowpass',.5);tone(38,1.6,'sine',.2,0,.2,.2);},
  thud(){tone(80,1.3,'sine',.5,0,.005,.7,32);noise(.4,.2,300,.7,0,'lowpass',.7);},
  grate(){tone(70,1.2,'sawtooth',.07,0,.05,.5,55);noise(1.2,.16,900,6,0,'bandpass',.5,500);noise(.15,.2,2500,8,1.15,'bandpass',.7);tone(620,.9,'triangle',.05,1.15,.002,.8);},
  snuff(){noise(.55,.09,5000,.7,0,'highpass',.3);},
  flare(){noise(.35,.12,600,1,0,'lowpass',.4,2500);},
  drip(){const f=1200+Math.random()*900;tone(f,.12,'sine',.06,0,.002,.9,f*.55);},
  chain(){for(let i=0;i<4;i++)tone(900+Math.random()*1500,.25,'triangle',.022,i*.09+Math.random()*.04,.002,.95);},
  crackle(v){noise(.02+Math.random()*.03,v,1500+Math.random()*3000,2,0,'bandpass',.2);},
  heart(){tone(64,.18,'sine',.55,0,.005,.05,40);tone(56,.2,'sine',.4,.24,.005,.05,38);}
};
function stopAmb(){if(!A.amb)return;const c=A.c,a=A.amb;a.g.gain.cancelScheduledValues(c.currentTime);a.g.gain.setTargetAtTime(0,c.currentTime,.5);setTimeout(()=>a.nodes.forEach(n=>{try{n.stop()}catch(e){}}),2500);A.amb=null;}
function setAmb(name){
  if(name===A.ambName&&A.amb)return;A.ambName=name;A.danger=0;if(!A.c)return;stopAmb();if(A.muted||!name)return;
  const c=A.c,t=c.currentTime,g=c.createGain(),nodes=[];g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(1,t+3);out(g,.5);
  const osc=(f,type,vol,dest,det=0)=>{const o=c.createOscillator();o.type=type;o.frequency.value=f;o.detune.value=det;const og=c.createGain();og.gain.value=vol;o.connect(og).connect(dest||g);o.start();nodes.push(o);return o;};
  const lfo=(rate,depth,param)=>{const o=c.createOscillator(),lg=c.createGain();o.frequency.value=rate;lg.gain.value=depth;o.connect(lg).connect(param);o.start();nodes.push(o);};
  const wind=(freq,vol,q=.8)=>{const s=c.createBufferSource();s.buffer=A.nb;s.loop=true;const f=c.createBiquadFilter();f.type='bandpass';f.frequency.value=freq;f.Q.value=q;const wg=c.createGain();wg.gain.value=vol;s.connect(f).connect(wg).connect(g);s.start();nodes.push(s);lfo(.07+Math.random()*.05,freq*.4,f.frequency);lfo(.11,vol*.6,wg.gain);};
  const drone=(vol,cut=220)=>{const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=cut;lp.Q.value=3;lp.connect(g);lfo(.05,cut*.5,lp.frequency);[55,55.4,82.4].forEach(f=>osc(f,'sawtooth',vol,lp));};
  if(name==='tribunal'){drone(.03,180);
    const ci=c.createGain(),f1=c.createBiquadFilter(),f2=c.createBiquadFilter(),cg=c.createGain();
    f1.type=f2.type='bandpass';f1.frequency.value=700;f1.Q.value=5;f2.frequency.value=1150;f2.Q.value=6;ci.connect(f1);ci.connect(f2);f1.connect(cg);f2.connect(cg);cg.connect(g);
    cg.gain.setValueAtTime(0,t);cg.gain.linearRampToValueAtTime(.9,t+6);lfo(.08,.3,cg.gain);
    [110,130.8,164.8,220].forEach(f=>[-9,9].forEach(d=>{const o=osc(f,'sawtooth',.05,ci,d);lfo(4.2+Math.random(),7,o.detune);}));}
  else if(name==='dungeon'){drone(.05);wind(420,.05);}
  else if(name==='sulphur'){drone(.04,160);wind(650,.03);osc(1318.5,'sine',.012);osc(1322,'sine',.012);const o=osc(987.8,'sine',.008);lfo(.3,12,o.detune);}
  else if(name==='pendulum'){drone(.045,200);wind(300,.03);}
  else if(name==='fire'){drone(.05,140);wind(240,.1,.5);wind(1300,.03);}
  else if(name==='camp'){const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=900;lp.connect(g);lfo(.1,300,lp.frequency);[130.8,196,261.6,329.6].forEach(f=>[-5,5].forEach(d=>osc(f,'triangle',.035,lp,d)));}
  A.amb={g,nodes};
}
function audioTick(dt){if(!A.c||A.muted)return;const n=A.ambName;
  if(n==='dungeon'||n==='sulphur'||n==='pendulum'){A.drip-=dt;if(A.drip<=0){A.drip=1.5+Math.random()*4;SFX.drip();}}
  if(n==='dungeon'||n==='tribunal'){A.chain-=dt;if(A.chain<=0){A.chain=9+Math.random()*10;SFX.chain();}}
  if(n==='fire'){A.crk-=dt;if(A.crk<=0){A.crk=.03+Math.random()*(.25-.18*A.danger);SFX.crackle(.04+.12*A.danger*Math.random());}}
  if((n==='pendulum'||n==='fire')&&A.danger>.15){A.hb-=dt;if(A.hb<=0){A.hb=1.15-.65*A.danger;SFX.heart();}}
}

/* ============ Shared art ============ */
let seed=42;const rnd=()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646;};
const stones=[];for(let r=0,y=0;y<H+46;y+=46,r++)for(let x=-(r%2)*31-10;x<W+20;x+=62)stones.push({x,y,c:16+rnd()*12,h:20+rnd()*15});
function drawFloor(sat=12){stones.forEach(s=>{ctx.fillStyle=`hsl(${s.h},${sat}%,${s.c}%)`;ctx.fillRect(s.x+2,s.y+2,58,42);});}

  const box=M.querySelector('#opts');
  opts.forEach(op=>{const b=document.createElement('button');b.className='opt';b.textContent=op.t;b.onclick=()=>{
    box.querySelectorAll('button').forEach(x=>x.disabled=true);b.classList.add(op.ok?'right':'wrong');
    if(op.ok)SFX.good();else{SFX.bad();miss();}
    const fb=M.querySelector('#fb');
    fb.innerHTML=`<p class="${op.ok?'okt':'badt'}">${op.ok?(q.yes||'Correct.'):(q.no||'Not quite. Think back to the story.')}</p>${op.ok&&q.why?`<p class="why">${q.why}</p>`:''}<button class="btn">Continue</button>`;

}

  },
  draw(t){const g=ctx.createRadialGradient(W/2,H*.3,20,W/2,H/2,W*.7);g.addColorStop(0,'#f3e2b8');g.addColorStop(.5,'#8a5a2a');g.addColorStop(1,'#1a0f08');ctx.fillStyle=g;ctx.fillRect(-20,-20,W+40,H+40);
    for(let i=0;i<9;i++){ctx.fillStyle=`rgba(255,255,240,${.08+.05*Math.sin(t+i)})`;ctx.beginPath();ctx.moveTo(W/2,-20);ctx.lineTo(W/2-500+i*125,H+20);ctx.lineTo(W/2-440+i*125,H+20);ctx.fill();}}
};

/* ============ Input, HUD, loop ============ */
const P={x:120,y:110};
function pt(e){const r=cv.getBoundingClientRect();return {x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H};}
cv.addEventListener('pointerdown',e=>{if(modalOpen()||fade.dir)return;const p=pt(e);P.x=p.x;P.y=p.y;try{cv.setPointerCapture(e.pointerId)}catch(_){}SC[cur].down&&SC[cur].down(p);});
cv.addEventListener('pointermove',e=>{const p=pt(e);P.x=p.x;P.y=p.y;cv.style.cursor=(cur==='ch1'&&C1.objs.some(o=>!o.done&&Math.hypot(p.x-o.x,p.y-o.y)<o.r))||(cur==='ch1'&&Math.abs(p.x-GRATE.x)<34&&Math.abs(p.y-GRATE.y)<50)?'pointer':'crosshair';if(!modalOpen()&&SC[cur].move)SC[cur].move(p);});
cv.addEventListener('pointerup',e=>{const p=pt(e);if(!modalOpen()&&SC[cur].up)SC[cur].up(p);});
$('#hintBtn').onclick=()=>{const s=SC[cur];if(!s.hints){say('No hints here — just keep going.');return;}const i=G.hintIx[cur]||0;say('<b>Hint:</b> '+s.hints[Math.min(i,s.hints.length-1)]);if(i<s.hints.length){G.hints++;G.hintIx[cur]=i+1;}};
$('#muteBtn').onclick=()=>{A.muted=!A.muted;$('#muteBtn').textContent='Sound: '+(A.muted?'Off':'On');if(A.master)A.master.gain.setTargetAtTime(A.muted?0:1,A.c.currentTime,.05);if(!A.muted&&!A.amb&&A.c){const n=A.ambName;A.ambName='';setAmb(n);}};
$('#restartBtn').onclick=()=>{if(confirm('Restart the escape room from the beginning?'))location.reload();};
function updateClock(){if(!G.start)return;const s=Math.floor(((G.end||Date.now())-G.start)/1000);$('#clock').textContent=`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;}
let last=performance.now();
function loop(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;const s=SC[cur],t=now/1000;
  if(!modalOpen()&&!fade.dir&&s.update)s.update(dt,t);
  ctx.save();if(G.shake>0){G.shake-=dt;ctx.translate((Math.random()-.5)*12,(Math.random()-.5)*12);}
  s.draw(t);ctx.restore();
  if(fade.dir){fade.a+=fade.dir*dt*1.3;if(fade.a>=1&&fade.cb){fade.a=1;const cb=fade.cb;fade.cb=null;cb();}if(fade.a<=0){fade.a=0;fade.dir=0;}}
  if(fade.a>0){ctx.fillStyle=`rgba(0,0,0,${fade.a})`;ctx.fillRect(-20,-20,W+40,H+40);}
  audioTick(dt);updateClock();requestAnimationFrame(loop);
}
SC.title.enter();requestAnimationFrame(loop);
</script>
</body>
